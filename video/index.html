<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --beige: #efeae2;
        --console: #fbfcfa;
        --green: #1f5c43;
        --slab: #f6f7f4;
        --ink: #1d2420;
        --mint: #9fe0b4;
        --ok: #276b3b;
        --red: #c0392b;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--beige); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="77" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="machine" data-composition-id="machine" data-composition-src="compositions/machine.html"
        data-start="9" data-duration="22" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="request" data-composition-id="request" data-composition-src="compositions/request.html"
        data-start="31" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="rules" data-composition-id="rules" data-composition-src="compositions/rules.html"
        data-start="43" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="emergency" data-composition-id="emergency" data-composition-src="compositions/emergency.html"
        data-start="53" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="restart" data-composition-id="restart" data-composition-src="compositions/restart.html"
        data-start="63" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ending" data-composition-id="ending" data-composition-src="compositions/ending.html"
        data-start="71" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Effects: each peak lands one frame after its picture (pop peaks 0.12 s in; the whoosh clip starts 1.9 s into the file, peak 0.6 s in). -->
      <audio id="pop-yes" class="clip" src="assets/sfx/pop.mp3" data-start="2.05" data-duration="0.7" data-track-index="3" data-volume="0.8"></audio>
      <audio id="pop-card" class="clip" src="assets/sfx/pop.mp3" data-start="32.18" data-duration="0.7" data-track-index="3" data-volume="0.8"></audio>
      <audio id="pop-update" class="clip" src="assets/sfx/pop.mp3" data-start="37.16" data-duration="0.7" data-track-index="3" data-volume="0.6"></audio>
      <audio id="whoosh-bypass" class="clip" src="assets/sfx/whoosh.mp3" data-start="54.45" data-duration="1.4" data-media-start="1.9" data-track-index="4" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
