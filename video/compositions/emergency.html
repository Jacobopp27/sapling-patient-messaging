<template>
  <style>
    #root { position: absolute; inset: 0; background: #1f5c43; font-family: "Inter", sans-serif; color: #f6f7f4; overflow: hidden; }
    #root .w { display: inline-block; }
    #e-head { position: absolute; left: 160px; top: 110px; font-size: 44px; font-weight: 600; }
    #e-head em { font-style: normal; color: #ffd2cc; }
    #e-pipe { position: absolute; left: 160px; top: 437px; width: 1600px; height: 6px; background: #f6f7f4; border-radius: 3px; opacity: 0.55; }
    .e-slab { position: absolute; top: 370px; width: 340px; height: 140px; background: #f6f7f4; color: #1d2420; border-radius: 18px; padding: 22px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.18); border: 4px solid transparent; }
    .e-slab h3 { font-size: 32px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
    .e-slab .r { margin-top: 10px; font-size: 28px; font-weight: 700; color: #c0392b; opacity: 0; }
    #e-s1 { left: 160px; } #e-s2 { left: 580px; } #e-s3 { left: 1000px; } #e-s4 { left: 1420px; }
    #e-arc { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #e-pill { position: absolute; left: 0; top: 300px; padding: 10px 26px; background: #c0392b; color: #fff; border-radius: 999px; font-size: 32px; font-weight: 700; z-index: 3; opacity: 0; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
    #e-out { position: absolute; left: 160px; top: 580px; width: 1152px;  opacity: 0; clip-path: inset(16px round 16px); }
    .e-line { position: absolute; left: 160px; top: 820px; width: 1600px; font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; opacity: 0; }
    .e-line em { font-style: normal; color: #9fe0b4; }
    #e-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="emergency" data-width="1920" data-height="1080">
    <p id="e-head">Alex: <em>“I have chest pain and my left arm feels numb”</em></p>
    <div id="e-pipe"></div>
    <div class="e-slab" id="e-s1"><h3>1 · Emergency</h3><div class="r">signals: chest pain, numbness</div></div>
    <div class="e-slab" id="e-s2"><h3>2 · Interpreter</h3></div>
    <div class="e-slab" id="e-s3"><h3>3 · Decision</h3></div>
    <div class="e-slab" id="e-s4"><h3>4 · Reply</h3></div>
    <svg id="e-arc" viewBox="0 0 1920 1080" data-layout-ignore>
      <path id="e-path" d="M 330 360 C 700 120, 1400 120, 1790 360" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 14" />
    </svg>
    <div id="e-pill">chest pain…</div>
    <img id="e-out" src="assets/shots/bubble-emergency.png" alt="The exact emergency text" />
    <p class="e-line" id="e-l1">Possible emergency: the <em>exact text</em>, with no model involved.</p>
    <p class="e-line" id="e-l2">Staff see it in red. <em>No promises</em> to Alex.</p>
    <div id="e-dip"></div>
  </div>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="emergency"]');
      function splitWords(el) {
        const out = [];
        [...el.childNodes].forEach((n) => {
          if (n.nodeType === 3) {
            n.textContent.split(/(\s+)/).forEach((t) => {
              if (!t) return;
              if (/^\s+$/.test(t)) out.push(document.createTextNode(t));
              else { const s = document.createElement("span"); s.className = "w"; s.textContent = t; out.push(s); }
            });
          } else { n.classList.add("w"); out.push(n); }
        });
        el.replaceChildren(...out);
        return el.querySelectorAll(".w");
      }
      const head = splitWords(root.querySelector("#e-head"));
      const l1 = splitWords(root.querySelector("#e-l1"));
      const l2 = splitWords(root.querySelector("#e-l2"));
      const path = root.querySelector("#e-path");
      const len = path.getTotalLength();
      path.style.strokeDasharray = `${len}`;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(head, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 0.1);
      tl.set("#e-path", { strokeDashoffset: len }, 0);
      tl.fromTo("#e-pill", { opacity: 0, x: 40 }, { opacity: 1, x: 100, duration: 0.4, ease: "expo.out" }, 0.5);
      tl.to("#e-pill", { x: 250, duration: 0.5, ease: "power2.inOut" }, 0.9);
      // The guard fires at station 1.
      tl.to("#e-s1", { borderColor: "#c0392b", backgroundColor: "#fdecea", duration: 0.15 }, 1.4);
      tl.fromTo("#e-s1 .r", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.45);
      // Red bypass over every other station.
      tl.to("#e-path", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 1.7);
      tl.to("#e-pill", { x: 1700, duration: 0.7, ease: "power2.inOut" }, 1.7);
      tl.to("#e-pill", { keyframes: [{ y: -170, duration: 0.35, ease: "sine.out" }, { y: 20, duration: 0.35, ease: "sine.in" }] }, 1.7);
      tl.to(["#e-s2", "#e-s3", "#e-s4"], { opacity: 0.3, duration: 0.3 }, 1.8);
      tl.to("#e-pill", { opacity: 0, duration: 0.2 }, 2.45);
      tl.fromTo("#e-out", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 2.5);
      tl.set("#e-l1", { opacity: 1 }, 3.3);
      tl.fromTo(l1, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 3.3);
      tl.to("#e-l1", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 6.0);
      tl.set("#e-l2", { opacity: 1 }, 6.2);
      tl.fromTo(l2, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067 }, 6.2);
      // Dip cut into the restart.
      tl.fromTo("#e-dip", { opacity: 0 }, { opacity: 0.4, duration: 0.1 }, 9.88);
      window.__timelines["emergency"] = tl;
    })();
  </script>
</template>
